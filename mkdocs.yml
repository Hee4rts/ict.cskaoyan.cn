site_name: 中国科学院计算技术研究所报考指南
site_description: 非官方公益计算所考研信息整理，汇总报考、初试、复试、培养与经验信息
site_url: https://ict.cskaoyan.cn/
repo_url: https://github.com/Hee4rts/ict.cskaoyan.cn
repo_name: Hee4rts/ict.cskaoyan.cn
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/memory
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/custom.css

extra_javascript:
  - assets/javascripts/admission-table.js
  - assets/javascripts/homepage.js

nav:
  - 首页: index.md
  - 报考信息:
      - 报考须知: 报考信息/报考须知.md
      - 招生简章: 报考信息/招生简章.md
  - 复试准备:
      - 复试规则: 复试准备/复试规则.md
      - 历年复试线: 复试准备/历年复试线.md
      - 录取数据: 复试准备/录取数据.md
  - 研究方向与实验室:
      - 总览: 研究方向与实验室/index.md
      - 处理器芯片重点实验室: 研究方向与实验室/实验室/处理器芯片重点实验室.md
      - 微处理器研究中心: 研究方向与实验室/实验室/微处理器研究中心.md
      - 智能处理器研究中心: 研究方向与实验室/实验室/智能处理器研究中心.md
      - 高性能计算机研究中心: 研究方向与实验室/实验室/高性能计算机研究中心.md
      - 高通量计算机研究中心: 研究方向与实验室/实验室/高通量计算机研究中心.md
      - 先进计算机系统研究中心: 研究方向与实验室/实验室/先进计算机系统研究中心.md
      - 智能计算机研究中心: 研究方向与实验室/实验室/智能计算机研究中心.md
      - 网络数据科学与技术重点实验室: 研究方向与实验室/实验室/网络数据科学与技术重点实验室.md
      - 智能算法安全重点实验室: 研究方向与实验室/实验室/智能算法安全重点实验室.md
      - 网络技术研究中心: 研究方向与实验室/实验室/网络技术研究中心.md
      - 无线通信技术研究中心: 研究方向与实验室/实验室/无线通信技术研究中心.md
      - 装备智能系统研究中心: 研究方向与实验室/实验室/装备智能系统研究中心.md
      - 分布式系统研究中心: 研究方向与实验室/实验室/分布式系统研究中心.md
      - 智能信息处理重点实验室: 研究方向与实验室/实验室/智能信息处理重点实验室.md
      - 泛在计算系统研究中心: 研究方向与实验室/实验室/泛在计算系统研究中心.md
      - 前瞻研究实验室: 研究方向与实验室/实验室/前瞻研究实验室.md
  - 经验分享: 经验分享/index.md
  - 关于:
      - 免责声明: 关于/免责声明.md

extra:
  generator: false
  social:
    - icon: material/web
      name: 中国科学院计算技术研究所
      link: https://www.ict.ac.cn/
    - icon: material/school
      name: 中国科学院大学招生信息网
      link: https://admission.ucas.ac.cn/

copyright: 非官方公益指南 · 内容仅供参考，请以计算所及国科大官方发布为准
